name: CI

on:
  push:
    branches: [main, production-ready]
  pull_request:
    branches: [main, production-ready]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test extras
        run: python -m pip install --upgrade pip && pip install pytest PyYAML
      - name: Syntax/undefined (ruff)
        run: pip install ruff && ruff check . --select E9,F63,F7,F82
      - name: Test
        run: python -m pytest -q
      - name: Import smoke
        run: python -c "import scanner; assert scanner.__version__"
